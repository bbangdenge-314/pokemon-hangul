<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>포켓몬 한글 따라쓰기 · 한 파일 버전</title>
<meta name="description" content="5살 어린이를 위한 포켓몬 한글 따라쓰기 놀이 - 1~9세대 전국도감 1025마리와 함께 첫 글자부터 가이드 없는 혼자 쓰기까지">
<meta name="theme-color" content="#b9e8ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon shortcut" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://raw.githubusercontent.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">

<style>
/* 포켓몬 한글 따라쓰기 - 스타일 (v4 · 밝고 귀여운 놀이방) */
:root {
  --ink: #4a3b52;
  --ink-soft: #8b7d95;
  --pink: #ff9ec4;
  --pink-deep: #ff6fa5;
  --sky: #7ccbff;
  --sky-deep: #38a8f0;
  --butter: #ffd166;
  --butter-deep: #f0b400;
  --mint: #7ee0b8;
  --lilac: #b9a4ff;
  --cream: #fffaf2;
  --white: #ffffff;
  --theme: #ff9ec4;
  --theme2: #ffe0ec;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
}

body {
  font-family: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', system-ui, sans-serif;
  color: var(--ink);
  background: linear-gradient(180deg, #c9ecff 0%, #ffe6f3 52%, #fff7e6 100%);
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
  overscroll-behavior: none;
}

button {
  font-family: inherit;
  color: inherit;
  border: 0;
  background: none;
  cursor: pointer;
  font-size: inherit;
  padding: 0;
}
input { font-family: inherit; }

#app {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100%;
  height: 100dvh;
  max-width: 560px;
  margin: 0 auto;
  overflow: hidden;
  background:
    radial-gradient(circle at 12% 8%, rgba(255, 255, 255, 0.85) 0 8%, transparent 9%),
    radial-gradient(circle at 88% 14%, rgba(255, 255, 255, 0.7) 0 6%, transparent 7%),
    linear-gradient(180deg, #d6f1ff 0%, #ffe9f4 50%, #fff8ea 100%);
  box-shadow: 0 0 70px rgba(98, 74, 110, 0.14);
}

#main {
  position: relative;
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
}

/* ---------------- HUD ---------------- */
#hud {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: calc(8px + var(--safe-t)) 12px 8px;
  background: rgba(255, 255, 255, 0.72);
  backdrop-filter: blur(10px);
  border-bottom: 3px solid rgba(255, 255, 255, 0.95);
  z-index: 20;
  flex: 0 0 auto;
}

.hud-btn {
  width: 46px;
  height: 46px;
  flex: 0 0 46px;
  border-radius: 16px;
  background: #fff;
  box-shadow: 0 3px 0 #ffd9e8, inset 0 0 0 2px #fff;
  font-size: 22px;
  line-height: 1;
  display: grid;
  place-items: center;
  transition: transform .1s;
}
.hud-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #ffd9e8; }

.hud-title {
  flex: 1;
  text-align: center;
  font-size: 20px;
  letter-spacing: -0.3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: #6b5573;
}

.hud-right { display: flex; align-items: center; gap: 8px; }

.star-chip {
  font-size: 16px;
  padding: 8px 12px;
  border-radius: 15px;
  background: #fff8dc;
  color: #a06d00;
  box-shadow: inset 0 0 0 2px #ffe9a8;
  white-space: nowrap;
}

/* ---------------- 공통 ---------------- */
.screen {
  min-height: 100%;
  padding: 14px 16px calc(24px + var(--safe-b));
  display: flex;
  flex-direction: column;
  position: relative;
}

.big-btn {
  display: block;
  width: 100%;
  min-height: 76px;
  border-radius: 28px;
  font-size: 28px;
  letter-spacing: -0.5px;
  transition: transform .1s, box-shadow .1s;
}
.big-btn.primary {
  background: linear-gradient(180deg, #ffd97a, #ffb627);
  color: #6a4400;
  box-shadow: 0 8px 0 #e8a000, 0 14px 26px rgba(255, 182, 39, 0.34), inset 0 2px 0 rgba(255, 255, 255, 0.7);
  text-shadow: 0 1px 0 rgba(255, 255, 255, 0.55);
}
.big-btn.primary:active { transform: translateY(5px); box-shadow: 0 3px 0 #e8a000; }

.ghost-btn {
  min-height: 54px;
  padding: 0 18px;
  border-radius: 20px;
  font-size: 18px;
  background: rgba(255, 255, 255, 0.94);
  color: #6f5c78;
  box-shadow: 0 4px 0 #ffd9e8;
  transition: transform .1s;
}
.ghost-btn b { color: var(--pink-deep); }
.ghost-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #ffd9e8; }

.speaker-btn {
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: radial-gradient(circle at 35% 28%, #ffffff, #ffeaf4 72%);
  box-shadow: 0 5px 0 #ffd0e4, 0 10px 18px rgba(98, 74, 110, 0.10);
  transition: transform .1s;
}
.speaker-btn:active { transform: translateY(3px) scale(.96); box-shadow: 0 2px 0 #ffd0e4; }
.speaker-btn.small {
  width: 52px;
  height: 52px;
  flex: 0 0 52px;
  font-size: 23px;
}

.gen-badge {
  display: inline-block;
  font-size: 13px;
  line-height: 1;
  padding: 5px 9px;
  border-radius: 999px;
  color: #fff;
  background: var(--gen, #b9a4ff);
  box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.12);
  vertical-align: middle;
}
.gen-badge.corner {
  position: absolute;
  top: 4px;
  right: 4px;
  font-size: 10px;
  padding: 3px 6px;
  opacity: .95;
}
.gen-badge.soft { background: #fff; color: var(--gen, #b9a4ff); box-shadow: inset 0 0 0 2px var(--gen, #b9a4ff); }

.type-chips { display: inline-flex; gap: 4px; flex-wrap: wrap; vertical-align: middle; }
.type-chip {
  font-size: 13px;
  line-height: 1;
  padding: 5px 9px;
  border-radius: 999px;
  color: #fff;
  background: var(--tc, #b3aea5);
  box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.12);
}
.type-chips.small .type-chip { font-size: 11px; padding: 4px 7px; }

.star { display: inline-block; margin-left: 1px; }
.star.on { color: #ffc107; text-shadow: 0 1px 0 #e39d00; }
.star.off { color: #ecdfe9; }

.img-fallback { opacity: .9; }

/* ---------------- 홈 ---------------- */
.home-screen {
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 18px 18px calc(20px + var(--safe-b));
  background:
    linear-gradient(180deg, #b9e8ff 0%, #d9f4ff 34%, #ffeaf4 62%, #fff8ea 100%);
  overflow: hidden;
}
.home-bubbles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.home-bubbles i {
  position: absolute;
  bottom: -40px;
  width: 26px; height: 26px;
  border-radius: 50%;
  background: radial-gradient(circle at 32% 28%, #fff, rgba(255, 255, 255, 0.35));
  box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.7);
  animation: bubbleUp 11s linear infinite;
  opacity: .75;
}
.home-bubbles i:nth-child(1) { left: 8%; animation-duration: 13s; }
.home-bubbles i:nth-child(2) { left: 26%; width: 16px; height: 16px; animation-duration: 9s; animation-delay: 2s; }
.home-bubbles i:nth-child(3) { left: 52%; width: 34px; height: 34px; animation-duration: 15s; animation-delay: 4s; }
.home-bubbles i:nth-child(4) { left: 74%; width: 20px; height: 20px; animation-duration: 10s; animation-delay: 1s; }
.home-bubbles i:nth-child(5) { left: 88%; width: 28px; height: 28px; animation-duration: 14s; animation-delay: 6s; }
@keyframes bubbleUp {
  0% { transform: translateY(0) scale(.6); opacity: 0; }
  12% { opacity: .8; }
  100% { transform: translateY(-92vh) scale(1.05); opacity: 0; }
}

.home-cloud {
  position: absolute;
  background: #fff;
  border-radius: 999px;
  opacity: .9;
  filter: blur(0.2px);
  animation: drift 30s linear infinite;
  pointer-events: none;
}
.home-cloud::before, .home-cloud::after {
  content: '';
  position: absolute;
  background: #fff;
  border-radius: 50%;
}
.home-cloud::before { width: 60%; height: 160%; left: 12%; top: -70%; }
.home-cloud::after { width: 44%; height: 130%; right: 10%; top: -50%; }
.home-cloud.c1 { width: 122px; height: 42px; top: 7%; left: -40%; animation-duration: 36s; }
.home-cloud.c2 { width: 82px; height: 30px; top: 17%; left: -30%; animation-duration: 26s; animation-delay: 3s; opacity: .75; }
.home-cloud.c3 { width: 150px; height: 50px; top: 2%; left: -50%; animation-duration: 46s; animation-delay: 7s; opacity: .6; }
@keyframes drift { from { transform: translateX(0); } to { transform: translateX(360%); } }

.home-inner {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  gap: 8px;
}

.home-badge {
  font-size: 14px;
  color: #3c7fa8;
  background: rgba(255, 255, 255, 0.92);
  border-radius: 999px;
  padding: 7px 15px;
  box-shadow: 0 3px 0 rgba(255, 255, 255, 0.6), inset 0 0 0 2px #e9f7ff;
}
.home-badge b { color: var(--pink-deep); font-size: 16px; }

.home-title {
  margin: 4px 0 0;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px;
  font-size: 40px;
  line-height: 1.05;
  letter-spacing: -1.6px;
  color: #4a3b52;
}
.home-title span {
  display: inline-block;
  padding: 2px 10px 6px;
  border-radius: 18px;
  background: #fff;
  box-shadow: 0 5px 0 #ffd9e8, inset 0 -3px 0 #fff0f6;
  animation: titleBob 3.4s ease-in-out infinite;
}
.home-title span:nth-child(1) { color: #ff6fa5; transform: rotate(-2deg); }
.home-title span:nth-child(2) { color: #38a8f0; transform: rotate(1.5deg); animation-delay: .2s; }
.home-title span:nth-child(3) { color: #f0a500; transform: rotate(-1deg); animation-delay: .4s; }
@keyframes titleBob {
  0%, 100% { translate: 0 0; }
  50% { translate: 0 -5px; }
}

.home-hero {
  position: relative;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 0;
  margin: 6px 0 0;
  width: 100%;
  min-height: 150px;
}
.hero-poke { position: relative; z-index: 1; }
.hero-poke.big { width: 42%; animation: bob 2.8s ease-in-out infinite; z-index: 2; }
.hero-poke.mini { width: 29%; animation: bob 3.4s ease-in-out infinite; animation-delay: .4s; }
.hero-poke.big .hero-img { filter: drop-shadow(0 12px 12px rgba(74, 59, 82, 0.18)); }
.hero-img { width: 100%; display: block; height: auto; }
.hero-ball {
  position: absolute;
  right: 1%;
  top: 4%;
  width: 46px;
  height: 46px;
  z-index: 0;
  border-radius: 50%;
  background: linear-gradient(180deg, #ff7ba9 0 46%, #4a3b52 46% 54%, #fff 54% 100%);
  box-shadow: 0 0 0 4px #fff, 0 6px 12px rgba(74, 59, 82, 0.2);
  animation: ballRoll 6s ease-in-out infinite;
  overflow: hidden;
}
.hero-ball b {
  position: absolute;
  left: 50%; top: 50%;
  width: 18px; height: 18px;
  margin: -9px 0 0 -9px;
  border-radius: 50%;
  background: #fff;
  border: 4px solid #4a3b52;
}
@keyframes ballRoll {
  0%, 100% { transform: rotate(-12deg) translateY(0); }
  50% { transform: rotate(12deg) translateY(-6px); }
}
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }

.home-sub {
  margin: 2px 0 6px;
  font-size: 18px;
  color: #6b5573;
  background: rgba(255, 255, 255, 0.72);
  padding: 6px 16px;
  border-radius: 999px;
}

.home-inner .big-btn { max-width: 400px; animation: btnGlow 3.2s ease-in-out infinite; }
@keyframes btnGlow {
  0%, 100% { box-shadow: 0 8px 0 #e8a000, 0 14px 26px rgba(255, 182, 39, 0.34), inset 0 2px 0 rgba(255, 255, 255, 0.7); }
  50% { box-shadow: 0 8px 0 #e8a000, 0 14px 34px rgba(255, 182, 39, 0.62), inset 0 2px 0 rgba(255, 255, 255, 0.8); }
}
.home-links { display: flex; gap: 10px; margin-top: 6px; flex-wrap: wrap; justify-content: center; }

/* ---------------- 세대 고르기 ---------------- */
.gen-pick {
  background: rgba(255, 255, 255, 0.82);
  border-radius: 22px;
  padding: 10px 10px 8px;
  box-shadow: 0 4px 0 #ffe0ee;
}
.gen-pick-title { font-size: 14px; color: #8b7d95; margin: 0 4px 7px; }
.gen-picker {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: none;
  -webkit-mask-image: linear-gradient(to right, #000 0 94%, transparent 100%);
  mask-image: linear-gradient(to right, #000 0 94%, transparent 100%);
}
.gen-picker::-webkit-scrollbar { display: none; }
.gen-chip {
  flex: 0 0 auto;
  min-height: 40px;
  padding: 6px 12px;
  border-radius: 14px;
  font-size: 14px;
  line-height: 1.1;
  color: #6f5c78;
  background: #fff;
  box-shadow: inset 0 0 0 2px #efe3ee, 0 3px 0 #efe3ee;
  white-space: nowrap;
  transition: transform .1s;
}
.gen-chip em { display: block; font-style: normal; font-size: 11px; color: #a695ae; }
.gen-chip.on {
  color: #fff;
  background: var(--gen, var(--pink));
  box-shadow: inset 0 0 0 2px #fff, 0 3px 0 rgba(0, 0, 0, 0.12);
}
.gen-chip.on em { color: rgba(255, 255, 255, 0.9); }
.gen-chip:active { transform: translateY(2px); }

/* ---------------- 지도 ---------------- */
.map-screen { gap: 10px; }
.map-top { display: flex; align-items: stretch; gap: 8px; }

.map-progress {
  flex: 1;
  background: rgba(255, 255, 255, 0.94);
  border-radius: 20px;
  padding: 10px 14px;
  box-shadow: 0 4px 0 #ffe0ee;
  font-size: 15px;
  color: var(--ink-soft);
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.map-progress b { color: var(--ink); font-size: 19px; }
.map-bar { margin-top: 7px; height: 11px; border-radius: 999px; background: #f6eaf3; overflow: hidden; }
.map-bar i {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, #7ee0b8, #ffd166, #ff9ec4);
  transition: width .5s ease;
}

.dex-btn {
  flex: 0 0 86px;
  height: auto;
  border-radius: 20px;
  background: #fff;
  box-shadow: 0 4px 0 #ffe0ee;
  font-size: 13px;
  color: #8b7d95;
  line-height: 1.35;
  padding: 6px 4px;
}
.dex-btn b { font-size: 19px; color: var(--pink-deep); }

.stage-list { display: flex; flex-direction: column; gap: 11px; }

.stage-card {
  position: relative;
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
  padding: 13px 13px 13px 12px;
  border-radius: 26px;
  background: #fff;
  text-align: left;
  box-shadow: 0 6px 0 var(--theme), 0 10px 20px rgba(98, 74, 110, 0.07);
  border: 3px solid #fff;
  transition: transform .1s;
  overflow: hidden;
}
.stage-card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 9px;
  background: var(--theme);
  opacity: .35;
}
.stage-card:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--theme); }
.stage-card.locked {
  background: #fbf6fb;
  border-color: #f6f0f5;
  box-shadow: 0 5px 0 #eadfe9;
  opacity: .95;
}
.stage-card.locked::before { background: #d9ccd7; }
.stage-card.cleared { background: linear-gradient(120deg, #fffdf5, #fff 60%); }

.sc-num {
  flex: 0 0 50px;
  width: 50px;
  height: 50px;
  border-radius: 18px;
  display: grid;
  place-items: center;
  font-size: 23px;
  background: var(--theme2);
  color: #7a5f86;
  box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.05), inset 0 0 0 2px #fff;
}
.locked .sc-num { background: #f3ecf2; font-size: 19px; }
.cleared .sc-num { background: var(--mint); color: #fff; }

.sc-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.sc-title { font-size: 20px; letter-spacing: -0.4px; color: #5a4564; }
.sc-sub { font-size: 14px; color: #9a8ca3; }
.sc-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 1px; }
.sc-stars { font-size: 14px; letter-spacing: 1px; line-height: 1; }
.sc-pool {
  font-size: 11px;
  color: #a08fae;
  background: #f8f1f8;
  border-radius: 999px;
  padding: 3px 8px;
}
.sc-icon { font-size: 24px; opacity: .9; }

.map-next, .map-done {
  text-align: center;
  font-size: 16px;
  color: #6b5573;
  background: rgba(255, 255, 255, 0.85);
  border-radius: 18px;
  padding: 11px;
}
.map-done { background: #fff3c4; color: #8a6400; }
.map-links { display: flex; gap: 10px; justify-content: center; }
.map-dex-note { text-align: center; font-size: 13px; color: #a08fae; }
.map-dex-note b { color: var(--pink-deep); }

/* ---------------- 따라쓰기 ---------------- */
.trace-screen {
  gap: 7px;
  padding: 9px 14px calc(10px + var(--safe-b));
}

.q-top { display: flex; align-items: center; gap: 9px; }
.q-step {
  background: var(--theme);
  color: #fff;
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 13px;
  white-space: nowrap;
  box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.1);
}
.q-bar {
  flex: 1;
  height: 10px;
  background: rgba(255, 255, 255, 0.9);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(98, 74, 110, 0.08);
}
.q-bar i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--theme), var(--butter));
  border-radius: 999px;
  transition: width .35s ease;
}
.q-count { font-size: 14px; color: #9a8ca3; white-space: nowrap; }
.q-count b { font-size: 18px; color: #5a4564; }

.poke-card {
  display: flex;
  align-items: center;
  gap: 9px;
  background: rgba(255, 255, 255, 0.95);
  border-radius: 24px;
  padding: 7px 9px;
  box-shadow: 0 5px 0 var(--theme2), inset 0 0 0 3px #fff;
  border: 1px solid rgba(255, 255, 255, 0.7);
}
.poke-art {
  position: relative;
  flex: 0 0 auto;
  width: 76px;
  height: 76px;
  border-radius: 20px;
  background: radial-gradient(circle at 50% 42%, #fff 0%, var(--theme2) 130%);
  display: grid;
  place-items: center;
  transition: transform .12s;
}
.poke-art:active { transform: scale(.94); }
.strip-poke { width: 96%; height: 96%; object-fit: contain; filter: drop-shadow(0 4px 5px rgba(74, 59, 82, 0.18)); animation: floatIn .35s ease both; }
@keyframes floatIn {
  from { opacity: 0; transform: translateY(7px) scale(.9); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.art-cry {
  position: absolute;
  top: -3px;
  right: -3px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 2px 0 #ffe0ee, inset 0 0 0 2px #fff5fa;
  font-size: 12px;
  display: grid;
  place-items: center;
  pointer-events: none;
}
.art-badge {
  position: absolute;
  bottom: -4px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 9px;
  color: #fff;
  background: var(--theme);
  padding: 2px 6px;
  border-radius: 999px;
  white-space: nowrap;
}

.poke-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.strip-hint { font-size: 12px; color: #9a8ca3; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; }

.name-row { display: flex; gap: 4px; flex-wrap: nowrap; overflow: hidden; align-items: stretch; }
.syl {
  display: grid;
  place-items: center;
  min-width: 38px;
  min-height: 38px;
  padding: 1px 5px;
  font-size: 25px;
  line-height: 1.1;
  border-radius: 12px;
  color: #b3a3bc;
  background: #fbf6fb;
  border: 2px dashed #ecdce9;
  transition: color .2s, background .2s, transform .2s, border-color .2s, box-shadow .2s;
}
.name-row.len2 .syl { font-size: 26px; min-width: 42px; }
.name-row.len3 .syl { font-size: 23px; min-width: 34px; padding: 1px 4px; }
.name-row.len4 .syl { font-size: 19px; min-width: 28px; padding: 1px 3px; }
.name-row.len5 .syl { font-size: 16px; min-width: 24px; padding: 1px 2px; }
.name-row.len6 .syl { font-size: 13px; min-width: 20px; padding: 1px 1px; border-width: 1px; }
.syl.fixed { color: #6f5c78; background: #fff; border: 2px solid #f3e8f1; }
.syl.target { color: #5a4564; background: #fffdf4; border: 2px solid #ffe08a; }
.syl.target.now { background: #fff5cc; border: 3px solid var(--butter); animation: sylPulse 1.4s ease-in-out infinite; box-shadow: 0 0 0 4px rgba(255, 209, 102, 0.18); }
.syl.target.current { transform: translateY(-1px); }
.syl.target.done { color: #1e8e63; background: #ddfff0; border: 2px solid #7ee0b8; animation: none; }
.syl.blank { color: #c2a35a; background: #fffdf5; border: 2px dashed #f0d494; }
.syl.blank.now { background: #fff6d8; border: 3px dashed #f0b429; }
@keyframes sylPulse {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-2px) scale(1.06); }
}

.trace-main {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 2px 0;
}

.trace-tools {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  min-height: 0;
  justify-content: center;
  flex-wrap: wrap;
}
.check-msg {
  font-size: 13px;
  line-height: 1.25;
  color: #1e8e63;
  text-align: center;
  max-width: 64%;
}
.check-msg:empty { display: none; }
.check-msg.warn { color: #d2601a; }
.hint-btn {
  min-height: 40px;
  padding: 0 14px;
  border-radius: 14px;
  font-size: 15px;
  color: #8a5a00;
  background: linear-gradient(180deg, #fff4d4, #ffe3a3);
  box-shadow: 0 3px 0 #e8c36a;
}
.hint-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #e8c36a; }

.box-wrap {
  position: relative;
  width: 300px;
  height: 300px;
  border-radius: 34px;
  flex: 0 0 auto;
  transition: transform .18s;
}
.box-bg {
  position: absolute;
  inset: 0;
  border-radius: 34px;
  background:
    radial-gradient(circle at 50% 40%, #ffffff 0%, #fffcfa 62%, #fff3f9 100%);
  box-shadow: inset 0 0 0 4px #ffe3f0, 0 8px 0 #ffd0e4, 0 16px 26px rgba(98, 74, 110, 0.10);
}
.guide-canvas,
.hint-canvas,
.ink-canvas {
  position: absolute;
  inset: 0;
  border-radius: 34px;
  width: 100%;
  height: 100%;
}
.hint-canvas { opacity: 0; transition: opacity .35s ease; pointer-events: none; }
.hint-canvas.show { opacity: 1; }
.ink-canvas { touch-action: none; cursor: crosshair; }

.zone-mark { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .2s; }
.zone-mark.show { opacity: 1; }
@keyframes zonePulse {
  0%, 100% { border-color: rgba(255, 138, 0, 0.92); }
  50% { border-color: rgba(255, 196, 0, 0.55); }
}
.zone-mark i {
  position: absolute;
  border: 3px dashed rgba(255, 138, 0, 0.92);
  border-radius: 18px;
  background: rgba(255, 214, 0, 0.10);
  box-shadow: inset 0 0 18px rgba(255, 196, 0, 0.25);
  animation: zonePulse 1.2s ease-in-out infinite;
}

.box-wrap.blank-box .box-bg {
  background:
    radial-gradient(circle at 50% 40%, #ffffff 0%, #fffdf6 64%, #fff7e4 100%);
  box-shadow: inset 0 0 0 4px #ffeec4, 0 8px 0 #ffe0a8, 0 16px 26px rgba(98, 74, 110, 0.10);
}
.box-wrap.blank-box .box-bg::after {
  content: '';
  position: absolute;
  inset: 9%;
  border-radius: 24px;
  border: 3px dashed rgba(226, 196, 130, 0.5);
}

.start-dot {
  position: absolute;
  width: 20px;
  height: 20px;
  margin: -10px 0 0 -10px;
  border-radius: 50%;
  background: #ff6fa5;
  box-shadow: 0 0 0 0 rgba(255, 111, 165, 0.55);
  animation: dotPulse 1.5s ease-out infinite;
  pointer-events: none;
}
@keyframes dotPulse {
  0% { box-shadow: 0 0 0 0 rgba(255, 111, 165, 0.5); }
  70% { box-shadow: 0 0 0 16px rgba(255, 111, 165, 0); }
  100% { box-shadow: 0 0 0 0 rgba(255, 111, 165, 0); }
}

.box-wrap.almost .box-bg { box-shadow: inset 0 0 0 4px #b6f0d6, 0 8px 0 #d4f7e8, 0 16px 26px rgba(30, 142, 99, 0.14); }
.box-wrap.done { animation: boxDone .6s ease; }
.box-wrap.done .box-bg { box-shadow: inset 0 0 0 5px #7ee0b8, 0 8px 0 #4cc79a, 0 16px 28px rgba(30, 142, 99, 0.22); }
@keyframes boxDone { 0% { transform: scale(1); } 45% { transform: scale(1.045); } 100% { transform: scale(1); } }

.cover-wrap {
  width: 74%;
  max-width: 340px;
  height: 11px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.92);
  box-shadow: inset 0 2px 3px rgba(98, 74, 110, 0.08);
  overflow: hidden;
}
.cover-bar {
  width: 0;
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, #7ee0b8, #37c9a3);
  transition: width .18s ease;
}
.cover-label { font-size: 14px; color: #9a8ca3; text-align: center; }

.trace-btns { display: flex; align-items: center; gap: 10px; width: 100%; }
.trace-btns .big-btn { flex: 1; min-height: 64px; font-size: 24px; border-radius: 24px; }
.round-btn {
  flex: 0 0 58px;
  width: 58px;
  height: 58px;
  border-radius: 50%;
  font-size: 24px;
  background: #fff;
  color: #6f5c78;
  box-shadow: 0 4px 0 #ffd0e4;
  display: grid;
  place-items: center;
  transition: transform .1s;
}
.round-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #ffd0e4; }

/* ---------------- 포켓몬 잡기 연출 ---------------- */
.catch-overlay,
.detail-overlay {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  background: rgba(74, 59, 82, 0.42);
  backdrop-filter: blur(4px);
  opacity: 0;
  transition: opacity .2s;
  z-index: 45;
  padding: 18px;
}
.catch-overlay.show, .detail-overlay.show { opacity: 1; }

.catch-card {
  position: relative;
  width: min(88vw, 340px);
  min-height: 330px;
  padding: 172px 18px 18px;
  border-radius: 32px;
  background: radial-gradient(circle at 50% 22%, #fffef7 0%, #fff3fa 48%, #e8f8ff 100%);
  box-shadow: 0 20px 44px rgba(50, 35, 60, 0.32), inset 0 0 0 4px #fff;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  gap: 5px;
  transform: scale(.92);
  transition: transform .25s cubic-bezier(.2, 1.5, .4, 1);
  overflow: hidden;
}
.catch-overlay.show .catch-card { transform: scale(1); }
.catch-rays {
  position: absolute;
  left: 50%; top: 40%;
  width: 340px; height: 340px;
  margin: -170px 0 0 -170px;
  border-radius: 50%;
  background:
    radial-gradient(circle, rgba(255, 240, 190, 0.6) 0 20%, rgba(255, 236, 170, 0.25) 44%, rgba(255, 236, 170, 0) 70%);
  opacity: 0;
  transform: scale(.6);
  transition: opacity .5s ease, transform .6s cubic-bezier(.2, 1.4, .4, 1);
}
.catch-overlay.show .catch-rays { opacity: 1; transform: scale(1); }

.catch-ball, .pokeball {
  position: absolute;
  left: 50%;
  top: 88px;
  width: 118px;
  height: 118px;
  margin-left: -59px;
  border-radius: 50%;
  background: linear-gradient(180deg, #ff7ba9 0 45%, #4a3b52 45% 55%, #fff 55% 100%);
  box-shadow: 0 0 0 5px #fff, 0 12px 22px rgba(50, 35, 60, 0.26);
  overflow: hidden;
  animation: ballShake .55s ease-in-out 3;
  transform-origin: 50% 88%;
}
.catch-ball .pb-top, .pokeball .pb-top { position: absolute; inset: 0; background: linear-gradient(180deg, #ff9ec4, #ff6fa5); clip-path: inset(0 0 55% 0); }
.catch-ball .pb-band, .pokeball .pb-band { position: absolute; left: 0; right: 0; top: 45%; height: 10%; background: #4a3b52; }
.catch-ball .pb-btn, .pokeball .pb-btn {
  position: absolute;
  left: 50%; top: 50%;
  width: 34px; height: 34px;
  margin: -17px 0 0 -17px;
  border-radius: 50%;
  background: #fff;
  border: 7px solid #4a3b52;
  box-sizing: content-box;
  width: 22px; height: 22px;
  margin: -18px 0 0 -18px;
}
.catch-ball.gone, .pokeball.gone { animation: ballOpen .4s ease forwards; opacity: 0; }
@keyframes ballShake {
  0%, 100% { transform: rotate(-14deg); }
  50% { transform: rotate(14deg); }
}
@keyframes ballOpen {
  0% { transform: scale(1); opacity: 1; }
  60% { transform: scale(1.35); opacity: .7; }
  100% { transform: scale(1.7); opacity: 0; }
}

.catch-poke {
  position: absolute;
  left: 50%;
  top: 22px;
  width: 176px;
  height: 150px;
  margin-left: -88px;
  opacity: 0;
  transform: scale(.35);
  transition: opacity .3s ease, transform .45s cubic-bezier(.2, 1.7, .4, 1);
}
.catch-poke.show { opacity: 1; transform: scale(1); }
.catch-img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 8px 10px rgba(50, 35, 60, 0.24)); animation: bob 2.4s ease-in-out infinite; }

.catch-name {
  position: relative;
  z-index: 2;
  font-size: 32px;
  letter-spacing: -0.8px;
  color: #4a3b52;
  text-shadow: 0 2px 0 #fff, 0 4px 10px rgba(74, 59, 82, 0.12);
}
.catch-tags { position: relative; z-index: 2; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; justify-content: center; }
.catch-tag {
  position: relative;
  z-index: 2;
  margin-top: 2px;
  font-size: 15px;
  color: #2b8a63;
  background: #e2fff2;
  padding: 5px 13px;
  border-radius: 999px;
}
.catch-again {
  position: relative;
  z-index: 2;
  margin-top: 4px;
  min-height: 40px;
  padding: 0 16px;
  border-radius: 14px;
  font-size: 15px;
  color: #6f5c78;
  background: #fff;
  box-shadow: 0 3px 0 #ffd9e8;
}
.catch-again:active { transform: translateY(2px); box-shadow: 0 1px 0 #ffd9e8; }

/* ---------------- 보상 ---------------- */
.reward-screen {
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 8px;
  background: radial-gradient(circle at 50% 30%, #fffef4 0%, #ffeef7 45%, #e6f8ff 100%);
}
.reward-sparks {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(circle at 18% 22%, rgba(255, 209, 102, 0.55) 0 3px, transparent 4px),
    radial-gradient(circle at 82% 18%, rgba(255, 158, 196, 0.55) 0 3px, transparent 4px),
    radial-gradient(circle at 30% 74%, rgba(126, 224, 184, 0.55) 0 3px, transparent 4px),
    radial-gradient(circle at 72% 68%, rgba(124, 203, 255, 0.55) 0 3px, transparent 4px);
  animation: twinkle 3s ease-in-out infinite;
}
@keyframes twinkle { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }

.reward-stage { position: relative; width: 240px; height: 200px; }
.reward-stage .pokeball { top: 44px; margin-left: -59px; animation: ballShake .5s ease-in-out 2; }
.reward-stage .pokeball.opening { animation: ballOpen .45s ease forwards; opacity: 0; }
.reward-poke {
  position: absolute;
  left: 50%;
  top: 6px;
  width: 200px;
  height: 190px;
  margin-left: -100px;
  opacity: 0;
  transform: scale(.4);
  transition: opacity .3s ease, transform .5s cubic-bezier(.2, 1.7, .4, 1);
}
.reward-poke.show { opacity: 1; transform: scale(1); }
.reward-poke.bonus { width: 130px; height: 130px; margin-left: -65px; top: 96px; left: 84%; }
.reward-img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 10px 12px rgba(74, 59, 82, 0.2)); animation: bob 2.6s ease-in-out infinite; }

.reward-title { margin: 0; font-size: 28px; letter-spacing: -0.8px; color: #4a3b52; text-shadow: 0 2px 0 #fff; }
.reward-stars { font-size: 34px; letter-spacing: 3px; line-height: 1; }
.reward-sub { font-size: 16px; color: #7d6b86; }
.reward-btns { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 340px; margin-top: 4px; }
.reward-dex { font-size: 14px; color: #9a8ca3; }

/* ---------------- 도감 ---------------- */
.dex-screen { gap: 8px; }
.dex-head {
  background: rgba(255, 255, 255, 0.92);
  border-radius: 22px;
  padding: 11px 14px;
  box-shadow: 0 4px 0 #ffe0ee;
}
.dex-count { font-size: 15px; color: #8b7d95; }
.dex-count b { font-size: 24px; color: var(--pink-deep); }
.dex-progress { margin-top: 6px; height: 11px; border-radius: 999px; background: #f6eaf3; overflow: hidden; }
.dex-progress i { display: block; height: 100%; background: linear-gradient(90deg, #ff9ec4, #ffd166); border-radius: 999px; transition: width .4s ease; }
.dex-hint { font-size: 12px; color: #a695ae; margin-top: 6px; }

.dex-gens { background: rgba(255, 255, 255, 0.8); border-radius: 18px; padding: 7px 8px; }

.dex-search {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #fff;
  border-radius: 18px;
  padding: 0 14px;
  box-shadow: 0 3px 0 #ffe0ee;
  min-height: 52px;
}
.dex-search span { font-size: 18px; opacity: .6; }
.dex-search input {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: 0;
  background: transparent;
  font-size: 17px;
  color: var(--ink);
  min-height: 50px;
}
.dex-search input::placeholder { color: #c0b2c8; }

.dex-filter-note { font-size: 12px; color: #a695ae; padding: 0 4px; min-height: 15px; }

.dex-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
  gap: 7px;
}
.dex-item {
  position: relative;
  background: #fff;
  border-radius: 18px;
  padding: 7px 4px 6px;
  box-shadow: 0 3px 0 #f0e5ee;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  transition: transform .1s;
  overflow: hidden;
}
.dex-item:active { transform: translateY(2px); }
.dex-item.got { background: linear-gradient(160deg, #fffdf6, #fff); box-shadow: 0 3px 0 #ffe0b8; }
.dex-img-wrap { width: 56px; height: 56px; display: grid; place-items: center; }
.dex-img { width: 100%; height: 100%; object-fit: contain; }
.dex-item:not(.got) .dex-img { filter: brightness(0) opacity(0.16); }
.dex-name { font-size: 13px; color: #5a4564; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dex-item:not(.got) .dex-name { color: #c0b2c8; }
.dex-no { font-size: 9px; color: #b9a8c1; }

.dex-more {
  min-height: 52px;
  border-radius: 18px;
  background: #fff;
  color: #6f5c78;
  font-size: 17px;
  box-shadow: 0 4px 0 #ffe0ee;
}
.dex-btns { display: flex; gap: 10px; justify-content: center; margin-top: 4px; }

/* 도감 상세 */
.detail-card {
  position: relative;
  width: min(90vw, 360px);
  padding: 20px 20px 22px;
  border-radius: 32px;
  background: radial-gradient(circle at 50% 18%, #fffef8 0%, #fff2f9 55%, #e9f8ff 100%);
  box-shadow: 0 20px 44px rgba(50, 35, 60, 0.3), inset 0 0 0 4px #fff;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  transform: scale(.94);
  transition: transform .25s cubic-bezier(.2, 1.5, .4, 1);
}
.detail-overlay.show .detail-card { transform: scale(1); }
.detail-close {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 42px;
  height: 42px;
  border-radius: 14px;
  font-size: 18px;
  color: #8b7d95;
  background: #fff;
  box-shadow: 0 3px 0 #ffe0ee;
}
.detail-art { width: 190px; height: 190px; display: grid; place-items: center; }
.detail-img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 10px 12px rgba(74, 59, 82, 0.18)); }
.detail-no { font-size: 13px; color: #a695ae; letter-spacing: 1px; }
.detail-name { font-size: 34px; letter-spacing: -1px; color: #4a3b52; }
.detail-tags { display: flex; align-items: center; gap: 6px; justify-content: center; flex-wrap: wrap; }
.cry-btn {
  margin-top: 8px;
  min-height: 62px;
  font-size: 20px;
  background: linear-gradient(180deg, #a8e9ff, #6cc9ff);
  color: #0d5a82;
  box-shadow: 0 6px 0 #3aa8e0, 0 12px 20px rgba(56, 168, 240, 0.25);
}
.cry-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #3aa8e0; }
.detail-lock { margin-top: 8px; font-size: 15px; color: #a08fae; line-height: 1.5; }

/* ---------------- 보호자 ---------------- */
.modal-overlay {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  background: rgba(74, 59, 82, 0.42);
  backdrop-filter: blur(3px);
  opacity: 0;
  transition: opacity .2s;
  z-index: 50;
  padding: 18px;
}
.modal-overlay.show { opacity: 1; }
.modal {
  width: min(90vw, 360px);
  background: #fff;
  border-radius: 30px;
  padding: 20px 18px;
  box-shadow: 0 20px 44px rgba(50, 35, 60, 0.3), inset 0 0 0 4px #fff;
  display: flex;
  flex-direction: column;
  gap: 9px;
}
.modal-title { font-size: 22px; text-align: center; color: #5a4564; }
.parent-stats {
  font-size: 14px;
  color: #7d6b86;
  background: #fff7fb;
  border-radius: 14px;
  padding: 10px 12px;
  text-align: center;
  line-height: 1.6;
}
.parent-stats b { color: #5a4564; }
.modal-btn {
  min-height: 54px;
  border-radius: 18px;
  font-size: 17px;
  background: #fff;
  color: #5a4564;
  box-shadow: 0 3px 0 #ffe0ee, inset 0 0 0 2px #fff3f9;
}
.modal-btn.danger { color: #c2410c; box-shadow: 0 3px 0 #ffd6c2; }
.modal-btn.danger.armed { background: #fff1e8; }
.modal-btn.plain { background: #f8f2f8; box-shadow: none; }
.modal-note { font-size: 12px; color: #a695ae; text-align: center; line-height: 1.5; }

/* ---------------- 기타 ---------------- */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(24px + var(--safe-b));
  transform: translate(-50%, 14px);
  background: rgba(74, 59, 82, 0.94);
  color: #fff;
  font-size: 15px;
  padding: 12px 18px;
  border-radius: 18px;
  max-width: min(86vw, 420px);
  text-align: center;
  opacity: 0;
  transition: opacity .22s, transform .22s;
  pointer-events: none;
  z-index: 60;
  box-shadow: 0 10px 24px rgba(50, 35, 60, 0.28);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

#confetti-layer { position: fixed; inset: 0; pointer-events: none; z-index: 55; overflow: hidden; }
.confetti {
  position: absolute;
  width: 9px;
  height: 13px;
  border-radius: 2px;
  will-change: transform;
  animation: confettiFall var(--dur, 1.4s) cubic-bezier(.25, .6, .4, 1) forwards;
}
@keyframes confettiFall {
  0% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
  100% { transform: translate(var(--dx, 0), var(--dy, 200px)) rotate(var(--rot, 180deg)) scale(.85); opacity: 0; }
}

@media (max-height: 700px) {
  .home-title { font-size: 33px; }
  .home-hero { min-height: 120px; }
  .poke-art { width: 66px; height: 66px; }
  .sc-title { font-size: 18px; }
  .sc-sub { font-size: 13px; }
  .big-btn { min-height: 66px; font-size: 25px; }
}

@media (min-width: 480px) {
  .home-title { font-size: 46px; }
  .sc-title { font-size: 22px; }
}

@media (prefers-reduced-motion: reduce) {
  .home-cloud, .home-bubbles i, .hero-poke, .hero-img, .catch-img, .reward-img,
  .home-inner .big-btn, .home-title span, .hero-ball { animation: none !important; }
}

</style>

<script>
/* 포켓몬 한글 따라쓰기 - 학습 데이터 (v4)
   - pokemon-data.js 의 전국도감 1~1025 를 쓰기 좋은 모양으로 다듬고
   - 6단계 문제를 그때그때 뽑는 규칙(문제 은행)을 담습니다.
   - 모든 포켓몬은 어느 단계에서는 꼭 나올 수 있습니다 (1,025마리 전부). */
window.POKE_DATA = (function () {
  'use strict';

  var RAW = window.POKEMON_DATA || { COUNT: 0, LIST: [] };
  var POKEMON = {};
  var POKE_IDS = [];
  (RAW.LIST || []).forEach(function (row, i) {
    var id = i + 1;
    POKEMON[id] = {
      id: id,
      name: row[0],
      gen: row[1],
      types: [row[2]].concat(row[3] ? [row[3]] : [])

    POKE_IDS.push(id);
  });

  var GEN_COLORS = {

  };
  var GEN_NAMES = {
    1: '관동', 2: '성도', 3: '호연', 4: '신오', 5: '하나',
    6: '칼로스', 7: '알로라', 8: '가라르', 9: '팔데아'
  };

  var TYPE_COLORS = {
    '노말': '#b3aea5', '불꽃': '#ff8a4c', '물': '#59b7f2', '전기': '#f7cf3f',
    '풀': '#68c96a', '얼음': '#79dbe8', '격투': '#e2685c', '독': '#b56bd6',
    '땅': '#d8ab5c', '비행': '#8fa9f0', '에스퍼': '#f573a9', '벌레': '#a6c23f',
    '바위': '#c2ad6b', '고스트': '#8374c6', '드래곤': '#6f75e8', '악': '#7e6d63',
    '강철': '#9fb0c4', '페어리': '#f09ed0'
  };

  var ARTWORK = 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/';
  var SPRITE = 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/';
  /* 포켓몬 울음소리 (PokeAPI cries) */
  var CRY = 'https://raw.githubusercontent.com/PokeAPI/cries/main/cries/pokemon/latest/';
  var CRY_ALT = 'https://cdn.jsdelivr.net/gh/PokeAPI/cries@main/cries/pokemon/latest/';

  function artworkUrl(id) { return ARTWORK + Number(id) + '.png'; }
  function spriteUrl(id) { return SPRITE + Number(id) + '.png'; }
  function cryUrl(id) { return CRY + Number(id) + '.ogg'; }
  function cryAltUrl(id) { return CRY_ALT + Number(id) + '.ogg'; }

  function genOf(id) { var p = POKEMON[id]; return p ? p.gen : 1; }
  function genLabel(id) { return genOf(id) + '세대'; }
  function nameOf(id) { var p = POKEMON[id]; return p ? p.name : ''; }
  function lenOf(id) { return nameOf(id).length; }
  function typeColor(t) { return TYPE_COLORS[t] || '#b3aea5'; }

  /* 세대별 마리 수 */
  var GEN_COUNT = {};
  POKE_IDS.forEach(function (id) {
    var g = genOf(id);
    GEN_COUNT[g] = (GEN_COUNT[g] || 0) + 1;
  });

  /* 단계를 깰 때 잡는 포켓몬 */
  var REWARDS = { 1: 175, 2: 197, 3: 252, 4: 282, 5: 393, 6: 888 };
  /* 모든 단계를 깨면 찾아오는 전설의 포켓몬 */
  var BONUS = 151;

  /*
    문제는 고정 목록이 아니라 단계 규칙(pool)으로 그때그때 뽑습니다.
    pool(id) 이 true 인 포켓몬이 그 단계에 나올 수 있습니다.
      - 1단계: 이름이 두 글자 이상 → 첫 글자 한 글자 따라 쓰기
      - 2단계: 한두 글자 이름 → 이름 전체
      - 3단계: 세 글자 이름 → 이름 전체
      - 4단계: 세·네 글자 이름 → 흐린 글자 전체
      - 5단계: 세 글자 이상 이름 → 빠진 한 글자 혼자 쓰기
      - 6단계: 두세 글자 이름 → 이름 전체 혼자 쓰기 (백지)
  */
  var STAGES = [
    {
      id: 1,
      title: '첫 글자 따라 쓰기',
      subtitle: '이름의 첫 글자 한 글자',
      icon: '✏️',
      theme: '#ff9ec4',
      theme2: '#ffd6e7',
      guide: 'strong',
      tip: '포켓몬 이름의 첫 글자를 손가락으로 따라 써요',
      count: 6,
      blank: false,
      pool: function (p) { return p.name.length >= 2; },
      trace: function (p) { return [0]; }
    },
    {
      id: 2,
      title: '짧은 이름 따라 쓰기',
      subtitle: '한두 글자 이름을 통째로',
      icon: '🙌',
      theme: '#79c9ff',
      theme2: '#cdeeff',
      guide: 'strong',
      tip: '짧은 이름을 처음부터 끝까지 따라 써요',
      count: 6,
      blank: false,
      pool: function (p) { return p.name.length <= 2; },
      trace: function (p) { return range(p.name.length); }
    },
    {
      id: 3,
      title: '세 글자 따라 쓰기',
      subtitle: '세 글자 이름 전체',
      icon: '💪',
      theme: '#ffc247',
      theme2: '#ffe9b8',
      guide: 'strong',
      tip: '세 글자를 차례대로 다 따라 써요',
      count: 6,
      blank: false,
      pool: function (p) { return p.name.length === 3; },
      trace: function (p) { return range(p.name.length); }
    },
    {
      id: 4,
      title: '흐린 글자 따라 쓰기',
      subtitle: '아주 연한 글자를 보고 따라 쓰기',
      icon: '🌫️',
      theme: '#a98bff',
      theme2: '#e3d9ff',
      guide: 'faint',
      tip: '아주 연한 글자를 눈으로 보고 따라 써요',
      count: 5,
      blank: false,
      pool: function (p) { return p.name.length === 3 || p.name.length === 4; },
      trace: function (p) { return range(p.name.length); }
    },
    {
      id: 5,
      title: '빈칸 혼자 쓰기',
      subtitle: '이름에서 빠진 한 글자를 혼자서',
      icon: '🧩',
      theme: '#4fd0a8',
      theme2: '#c9f5e6',
      guide: 'blank',
      tip: '빈칸 글자를 혼자 써 봐요',
      count: 5,
      blank: true,
      pool: function (p) { return p.name.length >= 3; },
      trace: function (p, rand) {
        /* 첫 글자는 보여 주고, 뒤에서 한 글자를 가린다 */
        var i = 1 + Math.floor((rand ? rand() : Math.random()) * (p.name.length - 1));
        return [Math.min(p.name.length - 1, i)];
      }
    },
    {
      id: 6,
      title: '이름 전체 혼자 쓰기!',
      subtitle: '가이드 없이 이름을 통째로',
      icon: '🏆',
      theme: '#ff7ba9',
      theme2: '#ffd9e6',
      guide: 'blank',
      tip: '이름 전체를 혼자 써 봐요',
      count: 4,
      blank: true,
      pool: function (p) { return p.name.length >= 2 && p.name.length <= 3; },
      trace: function (p) { return range(p.name.length); }
    }
  ];

  function range(n) {
    var out = [];
    for (var i = 0; i < n; i++) out.push(i);
    return out;
  }

  /* 단계에 나올 수 있는 포켓몬 (세대 고르기: 0 = 전체) */
  function stagePool(sid, gen) {
    var s = STAGES.filter(function (x) { return x.id === sid; })[0];
    if (!s) return [];
    return POKE_IDS.filter(function (id) {
      var p = POKEMON[id];
      if (gen && p.gen !== gen) return false;
      return s.pool(p);
    });
  }

  /* 그 세대에 그 단계로 나올 수 있는 포켓몬이 있는지 (없으면 전체로 돌아간다) */
  function stageAvailable(sid, gen) {
    return gen ? stagePool(sid, gen).length > 0 : true;
  }

  function shuffle(arr, rand) {
    var r = rand || Math.random;
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(r() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  /*
    단계 문제 n개를 뽑는다.
    - 이미 잡은 포켓몬보다 아직 못 만난 포켓몬을 먼저 넣어 도감이 골고루 채워지게 한다
    - 같은 단계 안에서 같은 포켓몬이 두 번 나오지 않는다
  */
  function makeQuestions(sid, gen, n, isCaught, rand) {
    var s = STAGES.filter(function (x) { return x.id === sid; })[0];
    if (!s) return [];
    var r = rand || Math.random;
    var pool = stagePool(sid, gen);
    var fresh = [];
    var seen = [];
    shuffle(pool.slice(), r).forEach(function (id) {
      if (typeof isCaught === 'function' && isCaught(id)) seen.push(id);
      else fresh.push(id);
    });
    var list = fresh.concat(seen);
    var want = Math.min(n || s.count, list.length);
    var out = [];
    for (var i = 0; i < want; i++) {
      var p = POKEMON[list[i]];
      out.push({ id: list[i], trace: s.trace(p, r) });
    }
    return out;
  }

  return {
    POKEMON: POKEMON,
    POKE_IDS: POKE_IDS,
    COUNT: POKE_IDS.length,
    STAGES: STAGES,
    REWARDS: REWARDS,
    BONUS: BONUS,
    GEN_COLORS: GEN_COLORS,
    GEN_NAMES: GEN_NAMES,
    GEN_COUNT: GEN_COUNT,
    TYPE_COLORS: TYPE_COLORS,
    artworkUrl: artworkUrl,
    spriteUrl: spriteUrl,
    cryUrl: cryUrl,
    cryAltUrl: cryAltUrl,
    genOf: genOf,
    genLabel: genLabel,
    nameOf: nameOf,
    lenOf: lenOf,
    typeColor: typeColor,
    stagePool: stagePool,
    stageAvailable: stageAvailable,
    makeQuestions: makeQuestions,
    shuffle: shuffle
  };
})();

   - 정밀 인식: 글자 덮음 + 3x3 구역 검사 + 글자 밖 벗어남 검사
   - 6단계: 진한 가이드 → 흐린 가이드 → 백지 혼자 쓰기
   - 포획할 때 포켓몬 울음소리 재생 (실패하면 한국어 목소리로 대신) */
(function () {

  var IDLE_MS = 2600;    /* 가만히 있으면 살짝 안내 */

  function defaultState() {

  function loadState() {
    var raw = null;

    if (!raw) {
      /* v3 기록이 있으면 잡은 포켓몬·별·잠금 해제를 이어받는다 */
