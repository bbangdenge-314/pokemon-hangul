<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>포켓몬 한글 대모험</title>
<meta name="description" content="5살 어린이를 위한 포켓몬 한글 공부 놀이 - 모음, 자음, 글자 합치기, 포켓몬 이름 읽기">
<meta name="theme-color" content="#7ed0ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon shortcut" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<style>
/* 포켓몬 한글 대모험 - 스타일 */
:root {
  --sky1: #8fdcff;
  --sky2: #e3f9ff;
  --ink: #23324a;
  --ink-soft: #4b5f7d;
  --yellow: #ffd23f;
  --white: #ffffff;
  --line: #d3e6f5;
  --theme: #4dabf7;
  --safe-b: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
}

body {
  font-family: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', system-ui, sans-serif;
  color: var(--ink);
  background: linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 55%, #fdfbf3 100%);
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}

button {
  font-family: inherit;
  color: inherit;
  border: 0;
  background: none;
  cursor: pointer;
  font-size: inherit;
}

#app {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100%;
  height: 100dvh;
  max-width: 560px;
  margin: 0 auto;
  overflow: hidden;
  background: linear-gradient(180deg, rgba(255,255,255,0.0) 0%, rgba(255,255,255,0.35) 100%);
  box-shadow: 0 0 60px rgba(35, 50, 74, 0.12);
}

#main {
  position: relative;
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
}

/* ---------------- HUD ---------------- */
#hud {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 8px;
  background: rgba(255, 255, 255, 0.72);
  backdrop-filter: blur(8px);
  border-bottom: 3px solid rgba(255, 255, 255, 0.9);
  z-index: 20;
  flex: 0 0 auto;
}
#hud[hidden] { display: none; }

.hud-btn {
  width: 46px;
  height: 46px;
  flex: 0 0 46px;
  border-radius: 16px;
  background: var(--white);
  box-shadow: 0 3px 0 var(--line);
  font-size: 22px;
  line-height: 1;
  display: grid;
  place-items: center;
  transition: transform .1s;
}
.hud-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }

.hud-title {
  flex: 1;
  text-align: center;
  font-size: 20px;
  letter-spacing: -0.3px;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-right { display: flex; align-items: center; gap: 8px; }

.star-chip {
  font-size: 17px;
  padding: 8px 12px;
  border-radius: 14px;
  background: #fff7d6;
  box-shadow: inset 0 0 0 2px #ffe89a;
  white-space: nowrap;
}

/* ---------------- 공통 화면 ---------------- */
.screen {
  min-height: 100%;
  padding: 16px 16px calc(28px + var(--safe-b));
  display: flex;
  flex-direction: column;
  position: relative;
}

.big-btn {
  display: block;
  width: 100%;
  min-height: 78px;
  border-radius: 26px;
  font-size: 28px;
  letter-spacing: -0.5px;
  transition: transform .1s, box-shadow .1s;
}
.big-btn.primary {
  background: linear-gradient(180deg, #ffd75e, #ffb703);
  color: #5a3b00;
  box-shadow: 0 7px 0 #e09a00, 0 12px 22px rgba(255, 183, 3, 0.35);
}
.big-btn.primary:active { transform: translateY(5px); box-shadow: 0 2px 0 #e09a00; }

.ghost-btn {
  min-height: 54px;
  padding: 0 20px;
  border-radius: 20px;
  font-size: 19px;
  background: rgba(255, 255, 255, 0.9);
  color: var(--ink-soft);
  box-shadow: 0 4px 0 rgba(180, 205, 225, 0.6);
  transition: transform .1s;
}
.ghost-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(180, 205, 225, 0.6); }

/* ---------------- 홈 ---------------- */
.home-screen {
  justify-content: center;
  align-items: center;
  text-align: center;
  background: linear-gradient(180deg, #7ed0ff 0%, #b9ecff 45%, #e8fbe0 72%, #a8e46a 72%, #8ed14e 100%);
}
.home-sky { position: absolute; inset: 0; pointer-events: none; }
.home-cloud {
  position: absolute;
  background: #fff;
  border-radius: 999px;
  opacity: .85;
  filter: blur(0.3px);
  animation: drift 26s linear infinite;
}
.home-cloud.c1 { width: 120px; height: 46px; top: 8%; left: -30%; animation-duration: 32s; }
.home-cloud.c2 { width: 80px; height: 32px; top: 18%; left: -20%; animation-duration: 24s; animation-delay: 4s; }
.home-cloud.c3 { width: 150px; height: 54px; top: 3%; left: -40%; animation-duration: 40s; animation-delay: 8s; }
@keyframes drift { from { transform: translateX(0); } to { transform: translateX(260%); } }

.home-grass {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 28%;
  background:
    radial-gradient(circle at 12% 100%, #7cc63f 0 26px, transparent 27px),
    radial-gradient(circle at 32% 100%, #7cc63f 0 30px, transparent 31px),
    radial-gradient(circle at 60% 100%, #7cc63f 0 24px, transparent 25px),
    radial-gradient(circle at 84% 100%, #7cc63f 0 28px, transparent 29px);
  pointer-events: none;
  opacity: .55;
}

.home-inner {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  gap: 10px;
  padding-bottom: 6px;
}

.home-badge {
  font-size: 15px;
  color: #2c6280;
  background: rgba(255, 255, 255, 0.85);
  border-radius: 999px;
  padding: 6px 16px;
  box-shadow: 0 3px 0 rgba(255, 255, 255, 0.5);
}

.home-title {
  margin: 2px 0 0;
  font-size: 46px;
  line-height: 1.08;
  letter-spacing: -1.5px;
  color: #143d5c;
  text-shadow: 0 3px 0 #fff, 0 6px 14px rgba(20, 61, 92, 0.18);
}

.home-hero {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 2px;
  margin: 6px 0 2px;
  width: 100%;
}
.hero-poke { position: relative; }
.hero-poke.big { width: 46%; animation: bob 2.6s ease-in-out infinite; z-index: 2; }
.hero-poke.mini { width: 31%; animation: bob 3.2s ease-in-out infinite; animation-delay: .4s; }
.hero-poke.big .hero-img { filter: drop-shadow(0 10px 10px rgba(20, 61, 92, 0.22)); }
.hero-img { width: 100%; display: block; height: auto; }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

.home-sub {
  margin: 2px 0 10px;
  font-size: 19px;
  color: #24506b;
  text-shadow: 0 1px 0 rgba(255,255,255,.8);
}

.home-inner .big-btn { max-width: 400px; }

.home-links { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; justify-content: center; }

/* ---------------- 지도 ---------------- */
.map-screen { gap: 12px; }

.map-top { display: flex; align-items: center; gap: 10px; }

.map-progress {
  flex: 1;
  background: rgba(255, 255, 255, 0.92);
  border-radius: 18px;
  padding: 10px 14px;
  box-shadow: 0 4px 0 rgba(190, 215, 232, 0.7);
  font-size: 16px;
  color: var(--ink-soft);
}
.map-progress b { color: var(--ink); font-size: 19px; }
.map-bar {
  margin-top: 8px;
  height: 12px;
  border-radius: 999px;
  background: #e6f1f9;
  overflow: hidden;
}
.map-bar i {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, #6bcb77, #ffd23f);
  transition: width .5s ease;
}

.dex-btn {
  flex: 0 0 auto;
  height: 62px;
  padding: 0 16px;
  border-radius: 20px;
  background: #fff;
  box-shadow: 0 4px 0 rgba(190, 215, 232, 0.8);
  font-size: 18px;
}

.stage-list { display: flex; flex-direction: column; gap: 12px; }

.stage-card {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 16px 16px 16px 14px;
  border-radius: 26px;
  background: #fff;
  text-align: left;
  box-shadow: 0 6px 0 var(--theme), 0 12px 22px rgba(35, 50, 74, 0.08);
  border: 3px solid var(--theme);
  transition: transform .1s;
  overflow: hidden;
}
.stage-card:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--theme); }
.stage-card.locked {
  background: #f2f6fa;
  border-color: #dbe6f0;
  box-shadow: 0 5px 0 #dbe6f0;
  opacity: .92;
}
.stage-card.cleared::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(120deg, rgba(107, 203, 119, 0.10), transparent 60%);
  pointer-events: none;
}

.sc-num {
  flex: 0 0 52px;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 24px;
  background: var(--theme);
  color: #fff;
  box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.12);
}
.locked .sc-num { background: #cdd9e5; font-size: 20px; }
.cleared .sc-num { background: #6bcb77; }

.sc-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.sc-title { font-size: 21px; letter-spacing: -0.4px; }
.sc-sub { font-size: 15px; color: #7a8fa6; }
.sc-icon { font-size: 26px; opacity: .9; }
.sc-stars { font-size: 15px; letter-spacing: 1px; margin-top: 1px; line-height: 1; }
.sc-stars .star.off { color: #dde7f0; }

.star { display: inline-block; margin-left: 1px; }
.star.on { color: #ffc107; text-shadow: 0 1px 0 #e39d00; }
.star.off { color: #e2ebf3; }

.map-next, .map-done {
  text-align: center;
  font-size: 18px;
  color: #35617e;
  background: rgba(255, 255, 255, 0.75);
  border-radius: 18px;
  padding: 12px;
}
.map-done { background: #fff4c2; color: #7a5b00; }
.map-links { display: flex; gap: 10px; justify-content: center; margin-top: 4px; }

/* ---------------- 퀴즈 ---------------- */
.quiz-screen { gap: 12px; }

.q-top { display: flex; align-items: center; justify-content: space-between; font-size: 17px; color: var(--ink-soft); }
.q-step {
  background: var(--theme);
  color: #fff;
  padding: 6px 14px;
  border-radius: 999px;
  font-size: 16px;
}
.q-count { font-size: 18px; }

.q-bar { height: 14px; background: rgba(255, 255, 255, 0.8); border-radius: 999px; overflow: hidden; box-shadow: inset 0 2px 4px rgba(35, 50, 74, 0.08); }
.q-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--theme), #ffe066); border-radius: 999px; transition: width .35s ease; }

.prompt-area {
  flex: 1;
  min-height: 190px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  background: rgba(255, 255, 255, 0.86);
  border-radius: 30px;
  padding: 18px;
  box-shadow: 0 6px 0 rgba(200, 222, 238, 0.8);
  border: 3px solid #fff;
}

.prompt-chip {
  font-size: 20px;
  color: var(--ink-soft);
  letter-spacing: -0.4px;
}

.speaker-btn {
  width: 118px;
  height: 118px;
  border-radius: 50%;
  font-size: 56px;
  display: grid;
  place-items: center;
  background: radial-gradient(circle at 35% 30%, #ffffff, #e9f5ff 70%);
  box-shadow: 0 8px 0 #cbe3f7, 0 14px 24px rgba(35, 50, 74, 0.12);
  animation: pulse 1.9s ease-in-out infinite;
  transition: transform .1s;
}
.speaker-btn:active { transform: scale(.94); }
.speaker-btn.small { width: 62px; height: 62px; font-size: 28px; box-shadow: 0 5px 0 #cbe3f7; animation: none; }
@keyframes pulse {
  0%, 100% { transform: scale(1); box-shadow: 0 8px 0 #cbe3f7, 0 0 0 0 rgba(77, 171, 247, 0.35); }
  50% { transform: scale(1.04); box-shadow: 0 8px 0 #cbe3f7, 0 0 0 18px rgba(77, 171, 247, 0); }
}

.prompt-help { font-size: 16px; color: #8195ab; }

.combine {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: nowrap;
}
.jamo {
  width: 72px;
  height: 86px;
  border-radius: 20px;
  display: grid;
  place-items: center;
  font-size: 52px;
  background: #fff;
  color: var(--theme);
  box-shadow: 0 5px 0 rgba(190, 215, 232, 0.9), inset 0 0 0 3px #eaf4fb;
  animation: floatIn .45s ease both;
}
.jamo:nth-child(3) { animation-delay: .12s; }
.jamo.blank { color: #b9c9d8; background: #f4f9fd; animation: wobble 2s ease-in-out infinite; }
.op { font-size: 32px; color: #93a9bd; }
@keyframes floatIn { from { opacity: 0; transform: translateY(14px) scale(.9); } to { opacity: 1; transform: none; } }
@keyframes wobble { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }

.poke-area { gap: 6px; }
.poke-card { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.poke-img { width: 46vw; max-width: 202px; height: auto; filter: drop-shadow(0 8px 10px rgba(35, 50, 74, 0.16)); animation: floatIn .45s ease both; }
.poke-name { font-size: 40px; letter-spacing: 2px; display: flex; gap: 4px; }
.name-ch { color: var(--ink); }
.name-blank {
  color: #ff6b6b;
  background: #fff0f0;
  border-radius: 12px;
  padding: 0 10px;
  box-shadow: inset 0 0 0 3px #ffc9c9;
  animation: wobble 1.8s ease-in-out infinite;
}
.poke-tag { font-size: 16px; color: #8195ab; background: #fff; padding: 4px 14px; border-radius: 999px; box-shadow: 0 3px 0 #e6f0f8; }

.hint-line {
  text-align: center;
  font-size: 19px;
  color: #7a5b00;
  background: #fff6cc;
  border-radius: 16px;
  padding: 8px 12px;
}

.options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.options.two { grid-template-columns: 1fr 1fr; }

.option {
  min-height: 96px;
  border-radius: 26px;
  font-size: 42px;
  color: var(--ink);
  background: #fff;
  box-shadow: 0 7px 0 var(--theme), 0 10px 18px rgba(35, 50, 74, 0.07);
  border: 3px solid var(--theme);
  display: grid;
  place-items: center;
  transition: transform .12s, background .15s;
  animation: floatIn .35s ease both;
}
.option:nth-child(2) { animation-delay: .05s; }
.option:nth-child(3) { animation-delay: .1s; }
.option:nth-child(4) { animation-delay: .15s; }
.option:active { transform: translateY(4px); box-shadow: 0 3px 0 var(--theme); }
.option.correct {
  background: linear-gradient(180deg, #b8f2b0, #7ee081);
  border-color: #2f9e44;
  box-shadow: 0 7px 0 #2f9e44;
  animation: pop .4s ease;
}
.option.wrong {
  background: #ffe3e3;
  border-color: #ff8787;
  box-shadow: 0 7px 0 #ff8787;
  animation: shake .4s ease;
}
.option.hint { animation: hintGlow 1.1s ease infinite; }

@keyframes pop { 0% { transform: scale(1); } 45% { transform: scale(1.09); } 100% { transform: scale(1); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
@keyframes hintGlow {
  0%, 100% { box-shadow: 0 7px 0 var(--theme), 0 0 0 0 rgba(107, 203, 119, 0.6); }
  50% { box-shadow: 0 7px 0 var(--theme), 0 0 0 12px rgba(107, 203, 119, 0); }
}

/* ---------------- 보상 ---------------- */
.reward-screen {
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 10px;
  background: radial-gradient(circle at 50% 32%, #fffbe6 0%, #fff4c2 35%, #d8f3ff 100%);
}

.reward-stage {
  position: relative;
  width: 100%;
  height: 240px;
  display: grid;
  place-items: center;
}

.pokeball {
  position: absolute;
  width: 150px;
  height: 150px;
  border-radius: 50%;
  background: #fff;
  border: 8px solid #2b2f3a;
  overflow: hidden;
  box-shadow: 0 12px 24px rgba(35, 50, 74, 0.22);
  animation: ballWobble 1.1s ease-in-out infinite;
  transition: opacity .35s;
}
.pb-top {
  position: absolute;
  left: 0; right: 0; top: 0; height: 50%;
  background: linear-gradient(180deg, #ff6b6b, #e03131);
}
.pb-band {
  position: absolute; left: 0; right: 0; top: calc(50% - 9px); height: 18px;
  background: #2b2f3a;
}
.pb-btn {
  position: absolute; left: 50%; top: 50%;
  width: 46px; height: 46px; margin: -23px 0 0 -23px;
  border-radius: 50%; background: #fff; border: 7px solid #2b2f3a;
}
@keyframes ballWobble {
  0%, 100% { transform: rotate(0deg); }
  25% { transform: rotate(-12deg); }
  75% { transform: rotate(12deg); }
}
.pokeball.opening { animation: ballPop .45s ease forwards; }
@keyframes ballPop { 0% { transform: scale(1); } 60% { transform: scale(1.25); } 100% { transform: scale(0); opacity: 0; } }
.pokeball.gone { display: none; }

.reward-poke {
  position: absolute;
  opacity: 0;
  transform: scale(.2);
  transition: opacity .4s ease, transform .5s cubic-bezier(.2, 1.6, .4, 1);
}
.reward-poke.show { opacity: 1; transform: scale(1); }
.reward-poke .reward-img { width: 220px; max-width: 62vw; height: auto; filter: drop-shadow(0 12px 16px rgba(35, 50, 74, 0.22)); animation: bob 2.4s ease-in-out infinite; }
.reward-poke.bonus.show { transform: scale(.55) translate(120px, -70px); }
.reward-poke.bonus .reward-img { width: 140px; }

.reward-title {
  margin: 6px 0 0;
  font-size: 30px;
  letter-spacing: -0.8px;
  color: #1d4e6b;
  text-shadow: 0 2px 0 #fff;
  animation: floatIn .5s ease both;
}
.reward-stars { font-size: 34px; letter-spacing: 4px; }
.reward-stars .star.on { color: #ffb703; text-shadow: 0 3px 0 #e08e00; }
.reward-stars .star.off { color: #dfe7ef; }
.reward-sub { font-size: 18px; color: #4a6c82; }
.reward-btns { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 400px; margin-top: 6px; }
.reward-btns .ghost-btn { width: 100%; }

/* ---------------- 도감 ---------------- */
.dex-screen { gap: 12px; }
.dex-head { display: flex; flex-direction: column; gap: 2px; align-items: center; }
.dex-count { font-size: 22px; }
.dex-count b { color: var(--theme); font-size: 30px; }
.dex-hint { font-size: 15px; color: #7a8fa6; }

.dex-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.dex-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 8px 4px 10px;
  border-radius: 20px;
  background: #fff;
  box-shadow: 0 4px 0 rgba(196, 218, 234, 0.9);
  transition: transform .1s;
}
.dex-item:active { transform: translateY(3px); }
.dex-img-wrap {
  width: 100%;
  aspect-ratio: 1 / 1;
  display: grid;
  place-items: center;
  border-radius: 14px;
  background: radial-gradient(circle at 50% 45%, #f7fbff, #e9f4fd);
  overflow: hidden;
}
.dex-img { width: 86%; height: auto; }
.dex-item:not(.got) .dex-img { filter: brightness(0) opacity(.16); }
.dex-name { font-size: 15px; color: var(--ink-soft); }
.dex-item.got .dex-name { color: var(--ink); }
.dex-item.pulse { animation: pop .5s ease; }
.dex-btns { display: flex; gap: 10px; justify-content: center; margin-top: 4px; }

/* ---------------- 모달 ---------------- */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(20, 40, 60, 0.45);
  display: grid;
  place-items: center;
  padding: 20px;
  opacity: 0;
  transition: opacity .2s;
  z-index: 50;
  backdrop-filter: blur(2px);
}
.modal-overlay.show { opacity: 1; }
.modal {
  width: 100%;
  max-width: 400px;
  background: #fff;
  border-radius: 28px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);

  }

  function starRow(n, max) {
    var out = '';
    for (var i = 0; i < (max || 3); i++) out += '<span class="star ' + (i < n ? 'on' : 'off') + '">★</span>';
    return out;
  }

  /* ---------------- 화면 ---------------- */
  var view = 'home';
  var stage = null; // 진행 중인 단계

  function setHud(title) {
    if (!title) { hud.hidden = true; hud.innerHTML = ''; return; }
    hud.hidden = false;
    hud.innerHTML =
      '<button class="hud-btn" data-act="back" aria-label="뒤로 가기">←</button>' +
      '<div class="hud-title">' + title + '</div>' +
      '<div class="hud-right">' +
      '<span class="star-chip" aria-label="별 개수">⭐ ' + totalStars() + '</span>' +
      '<button class="hud-btn" data-act="sound" aria-label="소리 켜기/끄기">' + (state.muted ? '🔇' : '🔊') + '</button>' +
      '</div>';
  }

  function shuffle(list) {
    var a = list.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* 홈 */
  function goHome() {
    view = 'home';
    setHud(null);
    var started = clearedCount() > 0 || state.unlocked > 1;
    var id1 = 25, id2 = 1, id3 = 4;
    main.innerHTML =
      '<section class="screen home-screen">' +
      '<div class="home-sky"></div>' +
      '<div class="home-cloud c1"></div><div class="home-cloud c2"></div><div class="home-cloud c3"></div>' +
      '<div class="home-inner">' +
      '<div class="home-badge">한글 첫걸음 · 5살</div>' +
      '<h1 class="home-title">포켓몬<br>한글 대모험</h1>' +
      '<div class="home-hero">' +
      '<div class="hero-poke mini">' + pokeImg(id2, 'hero-img') + '</div>' +
      '<div class="hero-poke big">' + pokeImg(id1, 'hero-img') + '</div>' +
      '<div class="hero-poke mini">' + pokeImg(id3, 'hero-img') + '</div>' +
      '</div>' +
      '<p class="home-sub">포켓몬을 잡으러 한글 여행을 떠나요!</p>' +
      '<button class="big-btn primary" data-act="start">' + (started ? '계속 하기' : '시작하기') + '</button>' +
      '<div class="home-links">' +
      '<button class="ghost-btn" data-act="dex">📕 나의 도감 (' + state.caught.length + ')</button>' +
      '<button class="ghost-btn" data-act="parent">👨‍👩‍👧 보호자</button>' +
      '</div>' +
      '</div>' +
      '<div class="home-grass"></div>' +
      '</section>';
  }

  /* 지도 */
  function goMap() {
    view = 'map';
    stage = null;
    setHud('모험 지도');
    var done = clearedCount();
    var html = '<section class="screen map-screen">';
    html += '<div class="map-top">' +
      '<div class="map-progress"><span>진행한 단계 <b>' + done + '</b> / 5</span>' +
      '<div class="map-bar"><i style="width:' + (done / 5 * 100) + '%"></i></div></div>' +
      '<button class="dex-btn" data-act="dex">📕 도감</button>' +
      '</div>';
    html += '<div class="stage-list">';
    STAGES.forEach(function (s, idx) {
      var locked = s.id > state.unlocked;
      var stars = state.cleared[s.id] || 0;
      var cleared = stars > 0;
      html += '<button class="stage-card' + (locked ? ' locked' : '') + (cleared ? ' cleared' : '') +
        '" data-act="stage" data-id="' + s.id + '" data-locked="' + (locked ? '1' : '0') + '" ' +
        'style="--theme:' + s.theme + '">' +
        '<span class="sc-num">' + (locked ? '🔒' : (cleared ? '✓' : s.id)) + '</span>' +
        '<span class="sc-body">' +
        '<span class="sc-title">' + (locked ? '아직 잠겨 있어요' : s.id + '단계 · ' + s.title) + '</span>' +
        '<span class="sc-sub">' + (locked ? s.id + '단계를 먼저 깨야 해요' : s.subtitle) + '</span>' +
        '<span class="sc-stars">' + starRow(stars) + '</span>' +
        '</span>' +
        '<span class="sc-icon">' + (locked ? '🚪' : s.icon) + '</span>' +
        '</button>';
    });
    html += '</div>';
    var nextUncleared = STAGES.filter(function (x) { return !(state.cleared[x.id] > 0); })[0];
    if (allCleared() || !nextUncleared) {
      html += '<div class="map-done">🎉 모든 단계를 깼어요! 최고예요!</div>';
    } else {
      html += '<div class="map-next">다음은 <b>' + nextUncleared.id + '단계 · ' + nextUncleared.title + '</b> 예요!</div>';
    }
    html += '<div class="map-links"><button class="ghost-btn" data-act="home">처음으로</button>' +
      '<button class="ghost-btn" data-act="parent">👨‍👩‍👧 보호자</button></div>';
    html += '</section>';
    main.innerHTML = html;
  }

  /* 단계 시작 */
  function startStage(id) {
    var s = STAGES.filter(function (x) { return x.id === id; })[0];
    if (!s) { goMap(); return; }
    if (id > state.unlocked) {
      Audio.wrong();
      toast('아직 잠겨 있어요! 앞 단계를 먼저 깨요 🔒');
      return;
    }
    stage = {
      data: s,
      index: 0,
      wrongHere: 0,
      stageWrong: 0,
      lock: false,
      order: s.questions.map(function (q) { return q; })
    };
    view = 'quiz';
    renderQuestion();
  }

  /* 문제 화면 */
  function renderQuestion() {
    var s = stage.data;
    var q = stage.data.questions[stage.index];
    var total = stage.data.questions.length;
    setHud(s.title);
    document.getElementById('hud').style.setProperty('--theme', s.theme);

    var prompt = '';
    var voiceOk = Speech.usable();
    function helpText(defaultText) {
      if (!voiceOk) return '소리: <b>' + q.say + '</b> · 이 기기에서 소리가 나오지 않아요';
      if (state.muted) return '소리가 꺼져 있어요! 🔊 를 눌러 주세요';
      return defaultText;
    }
    if (q.type === 'listen') {
      prompt = '<div class="prompt-area">' +
        '<div class="prompt-chip">무슨 소리일까요?</div>' +
        '<button class="speaker-btn" data-act="replay" aria-label="다시 듣기">🔊</button>' +
        '<div class="prompt-help">' + helpText('잘 듣고 같은 글자를 골라요') + '</div>' +
        '</div>';
    } else if (q.type === 'consonant') {
      prompt = '<div class="prompt-area">' +
        '<div class="prompt-chip">첫소리를 찾아보세요</div>' +
        '<button class="speaker-btn" data-act="replay" aria-label="다시 듣기">🔊</button>' +
        '<div class="prompt-help">' + helpText('이름을 잘 듣고 글자를 골라요') + '</div>' +
        '</div>';
    } else if (q.type === 'combine') {
      prompt = '<div class="prompt-area">' +
        '<div class="prompt-chip">합체하면 무슨 글자?</div>' +
        '<div class="combine">' +
        '<span class="jamo">' + q.consonant + '</span>' +
        '<span class="op">+</span>' +
        '<span class="jamo">' + q.vowel + '</span>' +
        '<span class="op">=</span>' +
        '<span class="jamo blank">?</span>' +
        '</div>' +
        '</div>';
    } else if (q.type === 'first' || q.type === 'fill') {
      var pkm = POKEMON[q.pokemon];
      var chars = pkm.name.split('');
      var blankAt = q.type === 'first' ? 0 : q.blank;
      var shown = chars.map(function (ch, i) {
        return i === blankAt ? '<span class="name-blank">?</span>' : '<span class="name-ch">' + ch + '</span>';
      }).join('');
      prompt = '<div class="prompt-area poke-area">' +
        '<div class="poke-card">' + pokeImg(q.pokemon, 'poke-img') +
        '<div class="poke-name">' + shown + '</div>' +
        '<div class="poke-tag">' + (q.type === 'first' ? '첫 글자는?' : '빈칸 글자는?') + '</div>' +
        '</div>' +
        '<button class="speaker-btn small" data-act="replay" aria-label="이름 다시 듣기">🔊</button>' +
        '</div>';
    }

    var opts = shuffle(q.options).map(function (o) {
      return '<button class="option" data-act="answer" data-val="' + o + '">' + o + '</button>';
    }).join('');

    main.innerHTML =
      '<section class="screen quiz-screen" style="--theme:' + s.theme + '">' +
      '<div class="q-top">' +
      '<div class="q-step">' + s.icon + ' ' + s.id + '단계</div>' +
      '<div class="q-count">' + (stage.index + 1) + ' / ' + total + '</div>' +
      '</div>' +
      '<div class="q-bar"><i style="width:' + (stage.index / total * 100) + '%"></i></div>' +
      prompt +
      (q.type === 'combine' ? '<div class="hint-line" id="hint-line" hidden></div>' : '') +
      '<div class="options ' + (q.options.length === 2 ? 'two' : '') + '">' + opts + '</div>' +
      '</section>';

    stage.lock = false;
    stage.wrongHere = 0;

    // 자동 읽기
    var speech = '';
    if (q.type === 'listen') speech = q.say;
    else if (q.type === 'consonant') speech = q.say;
    else if (q.type === 'first' || q.type === 'fill') speech = POKEMON[q.pokemon].name;
    else if (q.type === 'combine') speech = '';
    if (speech) {
      setTimeout(function () { if (view === 'quiz' && stage) Speech.speak(speech); }, 320);
    }
  }

  function speakPrompt() {
    if (!stage) return;
    var q = stage.data.questions[stage.index];
    if (q.type === 'listen' || q.type === 'consonant') Speech.speak(q.say);
    else if (q.type === 'first' || q.type === 'fill') Speech.speak(POKEMON[q.pokemon].name);
    else if (q.type === 'combine') Speech.speak(q.answer);
  }

  function answer(btn) {
    if (!stage || stage.lock) return;
    var q = stage.data.questions[stage.index];
    var val = btn.getAttribute('data-val');
    if (val === q.answer) {
      stage.lock = true;
      btn.classList.add('correct');
      Audio.correct();
      var rect = btn.getBoundingClientRect();
      confetti(18, { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 });
      var praise = PRAISE[Math.floor(Math.random() * PRAISE.length)];
      var say = praise;
      if (q.type === 'first' || q.type === 'fill') say = q.answer + '! ' + POKEMON[q.pokemon].name + '!';
      else say = praise + ' ' + q.answer;
      Speech.speak(say);
      if (q.pokemon && catchPokemon(q.pokemon)) {
        setTimeout(function () {
          Audio.pop();
          toast('📕 ' + POKEMON[q.pokemon].name + '를 도감에 담았어!');
        }, 420);
      }
      setTimeout(function () {
        stage.index += 1;
        if (stage.index >= stage.data.questions.length) finishStage();
        else { renderQuestion(); refreshHud(); }
      }, 1050);
    } else {
      btn.classList.add('wrong');
      Audio.wrong();
      stage.wrongHere += 1;
      stage.stageWrong += 1;
      stage.lock = true;
      setTimeout(function () {
        btn.classList.remove('wrong');
        stage.lock = false;
      }, 480);
      if (stage.wrongHere === 1) {
        Speech.speak('음, 다시 해볼까?');
      } else if (stage.wrongHere >= 2) {
        var target = main.querySelector('.option[data-val="' + q.answer + '"]');
        if (target) target.classList.add('hint');
        var hintLine = document.getElementById('hint-line');
        if (q.type === 'combine') {
          if (hintLine) {
            hintLine.hidden = false;
            hintLine.innerHTML = q.consonant + ' + ' + q.vowel + ' = <b>' + q.answer + '</b> 이렇게 읽어요!';
          }
          Speech.speak(q.consonant + ' ' + q.vowel + ', ' + q.answer);
        } else if (q.type === 'first' || q.type === 'fill') {
          Speech.speak(POKEMON[q.pokemon].name + ', ' + q.answer);
        } else {
          Speech.speak(q.answer);
        }
      }
    }
  }

  function refreshHud() {
    var chip = document.querySelector('.star-chip');
    if (chip) chip.textContent = '⭐ ' + totalStars();
  }

  /* 단계 완료 */
  function finishStage() {
    var s = stage.data;
    var stars = stage.stageWrong === 0 ? 3 : (stage.stageWrong <= 2 ? 2 : 1);
    var prev = state.cleared[s.id] || 0;
    if (stars > prev) state.cleared[s.id] = stars;
    else state.cleared[s.id] = prev;
    if (state.unlocked < s.id + 1) state.unlocked = Math.min(5, s.id + 1);
    var rewardId = REWARDS[s.id];
    var gotReward = catchPokemon(rewardId);
    var bonusId = null;
    if (allCleared() && !isCaught(BONUS)) {
      catchPokemon(BONUS);
      bonusId = BONUS;
    }
    saveState();
    renderReward(s, stars, rewardId, gotReward, bonusId);
  }

  function renderReward(s, stars, rewardId, gotReward, bonusId) {
    view = 'reward';
    setHud(null);
    var nextId = s.id + 1;
    var hasNext = nextId <= 5;
    var pkm = POKEMON[rewardId];
    var showBonus = s.id === 5 && isCaught(BONUS);
    var title = gotReward ? '야호! ' + pkm.name + '를 잡았다!' : s.id + '단계 완료!';
    main.innerHTML =
      '<section class="screen reward-screen" style="--theme:' + s.theme + '">' +
      '<div class="reward-sparks"></div>' +
      '<div class="reward-stage">' +
      '<div class="pokeball" id="reward-ball"><span class="pb-top"></span><span class="pb-band"></span><span class="pb-btn"></span></div>' +
      '<div class="reward-poke" id="reward-poke">' + pokeImg(rewardId, 'reward-img') + '</div>' +
      (showBonus ? '<div class="reward-poke bonus" id="reward-bonus">' + pokeImg(BONUS, 'reward-img') + '</div>' : '') +
      '</div>' +
      '<h2 class="reward-title">' + title + '</h2>' +
      '<div class="reward-stars">' + starRow(stars) + '</div>' +
      '<div class="reward-sub">' + (showBonus
        ? (bonusId ? '모든 단계를 깼어요! 전설의 포켓몬 <b>뮤</b>가 찾아왔어요 ✨' : '모든 단계를 깼어요! 정말 대단해요 ✨')
        : s.id + '단계 ' + s.title + ' 성공!') + '</div>' +
      '<div class="reward-btns">' +
      (hasNext
        ? '<button class="big-btn primary" data-act="next-stage" data-id="' + nextId + '">' + nextId + '단계 도전!</button>'
        : '<button class="big-btn primary" data-act="dex">📕 도감 보러 가기</button>') +
      '<button class="ghost-btn" data-act="map" data-id="' + s.id + '">모험 지도</button>' +
      '</div>' +
      '</section>';

    setTimeout(function () {
      var ball = document.getElementById('reward-ball');
      if (ball) ball.classList.add('opening');
      Audio.pop();
    }, 650);
    setTimeout(function () {
      var ball = document.getElementById('reward-ball');
      if (ball) ball.classList.add('gone');
      var poke = document.getElementById('reward-poke');
      if (poke) poke.classList.add('show');
      var bonus = document.getElementById('reward-bonus');
      if (bonus) bonus.classList.add('show');
      Audio.fanfare();
      confetti(40);
      Speech.speak((gotReward ? pkm.name + '를 잡았다! ' : '') + (s.id === 5 ? '모든 단계를 깼어! 최고야!' : '대단해! 최고야!'), { rate: 0.92 });
    }, 1000);
    setTimeout(function () { confetti(26, { x: window.innerWidth * 0.2, y: window.innerHeight * 0.35 }); }, 1500);
    setTimeout(function () { confetti(26, { x: window.innerWidth * 0.8, y: window.innerHeight * 0.35 }); }, 1900);
  }

  /* 도감 */
  function goDex() {
    view = 'dex';
    setHud('나의 포켓몬 도감');
    var caughtN = state.caught.length;
    var html = '<section class="screen dex-screen">' +
      '<div class="dex-head">' +
      '<div class="dex-count"><b>' + caughtN + '</b> / ' + POKE_IDS.length + ' 마리</div>' +
      '<div class="dex-hint">잡은 포켓몬을 눌러 이름을 들어 보세요</div>' +
      '</div>' +
      '<div class="dex-grid">';
    POKE_IDS.forEach(function (id) {
      var got = isCaught(id);
      html += '<button class="dex-item' + (got ? ' got' : '') + '" data-act="dex-item" data-id="' + id + '" aria-label="' + (got ? POKEMON[id].name : '아직 못 만난 포켓몬') + '">' +
        '<span class="dex-img-wrap">' + pokeImg(id, 'dex-img') + '</span>' +
        '<span class="dex-name">' + (got ? POKEMON[id].name : '???') + '</span>' +
        '</button>';
    });
    html += '</div>' +
      '<div class="dex-btns">' +
      '<button class="ghost-btn" data-act="map">모험 지도</button>' +
      '<button class="ghost-btn" data-act="home">처음으로</button>' +
      '</div>' +
      '</section>';
    main.innerHTML = html;
  }

  /* 보호자 메뉴 */
  var resetArmed = false;
  function openParent() {
    resetArmed = false;
    var caughtN = state.caught.length;
    var doneN = clearedCount();
    var overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.id = 'parent-modal';
    overlay.innerHTML =
      '<div class="modal" role="dialog" aria-modal="true" aria-label="보호자 메뉴">' +
      '<div class="modal-title">보호자 메뉴</div>' +
      '<div class="parent-stats">진행한 단계 <b>' + doneN + ' / 5</b> · 모은 별 <b>⭐' + totalStars() + '</b> · 잡은 포켓몬 <b>' + caughtN + '마리</b></div>' +
      '<button class="modal-btn" data-act="sound">' + (state.muted ? '🔇 소리 켜기' : '🔊 소리 끄기') + '</button>' +
      '<button class="modal-btn" data-act="unlock-all">🔓 전체 단계 열기</button>' +
      '<button class="modal-btn danger" data-act="reset-all">🧹 진행 기록 지우기</button>' +
      '<button class="modal-btn plain" data-act="close-parent">닫기</button>' +
      '<div class="modal-note">진행 상황은 이 기기(브라우저)에만 저장돼요.</div>' +
      '</div>';
    document.body.appendChild(overlay);
    requestAnimationFrame(function () { overlay.classList.add('show'); });
  }
  function closeParent() {
    var overlay = document.getElementById('parent-modal');
    if (!overlay) return;
    overlay.classList.remove('show');
    setTimeout(function () { overlay.remove(); }, 200);
  }

  /* ---------------- 동작 처리 ---------------- */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]');
    if (!t) return;
    var act = t.getAttribute('data-act');

    if (act !== 'answer' && act !== 'dex-item') Audio.tap();

    switch (act) {
      case 'start':
        goMap();
        break;
      case 'home':
        goHome();
        break;
      case 'map':
        goMap();
        break;
      case 'back':
        if (view === 'quiz') { Speech.stop(); goMap(); }
        else goHome();
        break;
      case 'stage': {
        var id = Number(t.getAttribute('data-id'));
        if (t.getAttribute('data-locked') === '1') {
          Audio.wrong();
          toast('아직 잠겨 있어요! 🔒 ' + id + '단계를 먼저 깨요');
          Speech.speak(id + '단계는 아직 잠겨 있어요');
        } else {
          startStage(id);
        }
        break;
      }
      case 'answer':
        answer(t);
        break;
      case 'replay':
        speakPrompt();
        break;
      case 'next-stage':
        startStage(Number(t.getAttribute('data-id')));
        break;
      case 'dex':
        goDex();
        break;
      case 'dex-item': {
        var pid = Number(t.getAttribute('data-id'));
        if (isCaught(pid)) {
          Audio.pop();
          t.classList.add('pulse');
          setTimeout(function () { t.classList.remove('pulse'); }, 600);
          Speech.speak(POKEMON[pid].name);
        } else {
          Audio.wrong();
          Speech.speak('아직 만나지 못했어요');
        }
        break;
      }
      case 'parent':
        openParent();
        break;
      case 'close-parent':
        closeParent();
        break;
      case 'sound': {
        state.muted = !state.muted;
        saveState();
        if (state.muted) Speech.stop();
        var sb = document.querySelector('.hud-btn[data-act="sound"]');
        if (sb) sb.textContent = state.muted ? '🔇' : '🔊';
        var mb = document.querySelector('.modal-btn[data-act="sound"]');
        if (mb) mb.textContent = state.muted ? '🔇 소리 켜기' : '🔊 소리 끄기';
        toast(state.muted ? '🔇 소리를 껐어요' : '🔊 소리를 켰어요');
        break;
      }
      case 'unlock-all': {
        state.unlocked = 5;
        saveState();
        closeParent();
        toast('🔓 모든 단계를 열었어요');
        if (view === 'map') goMap();
        break;
      }
      case 'reset-all': {
        if (!resetArmed) {
          resetArmed = true;
          t.textContent = '⚠️ 정말 지울까요? 한 번 더 누르면 지워져요';
          t.classList.add('armed');
        } else {
          var muted = state.muted;
          state = defaultState();
          state.muted = muted;
          saveState();
          resetArmed = false;
          closeParent();
          toast('🧹 진행 기록을 지웠어요');
          goHome();
        }
        break;
      }
    }
  });

  /* 오버레이 바깥을 누르면 닫기 */
  document.addEventListener('click', function (e) {
    var overlay = document.getElementById('parent-modal');
    if (overlay && e.target === overlay) closeParent();
  });

  /* 시작 */
  loadState();
  recalcStars();
  Speech.init();
  goHome();
})();

</script>
</body>
</html>
